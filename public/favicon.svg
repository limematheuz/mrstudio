<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
    </defs>
    <!-- Background (optional, but good for visibility on dark/light tabs) -->
    <rect width="100" height="100" rx="20" fill="#ffffff" />
    <rect width="100" height="100" rx="20" fill="url(#grad)" opacity="0.1" />
    
    <!-- Text -->
    <text x="50" y="68" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="52" fill="url(#grad)" text-anchor="middle" letter-spacing="-2">MR</text>
</svg>
